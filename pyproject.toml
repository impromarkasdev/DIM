[project]
name = "dim-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "psycopg-pool>=3.2.0",
    "PyPDF2>=3.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "vercel-queue[typed]>=0.9,<1"
]

[tool.vercel]
entrypoint = "api.index:handler"

[[tool.vercel.subscribers]]
entrypoint = "app.queue_worker:process_dim_reference"
